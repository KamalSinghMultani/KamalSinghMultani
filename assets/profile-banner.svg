<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Kamal Singh Multani — Cloud, Automation, Full Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#111b38"/>
      <stop offset="1" stop-color="#25143f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#60a5fa" stop-opacity=".28"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#93c5fd" stroke-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="995" cy="120" r="220" fill="url(#glow)"/>
  <path d="M0 252C210 208 340 315 580 256S958 219 1200 252V300H0Z" fill="#38bdf8" opacity=".06"/>

  <g transform="translate(68 62)">
    <rect width="58" height="8" rx="4" fill="url(#accent)"/>
    <text x="0" y="76" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="55" font-weight="800" letter-spacing="1.5">KAMAL SINGH MULTANI</text>
    <text x="2" y="119" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="4">CLOUD • AUTOMATION • FULL-STACK</text>
    <g transform="translate(0 153)" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
      <rect width="122" height="34" rx="17" fill="#38bdf8" fill-opacity=".13" stroke="#38bdf8" stroke-opacity=".45"/>
      <text x="21" y="22" fill="#7dd3fc">☁ BUILD</text>
      <rect x="136" width="142" height="34" rx="17" fill="#818cf8" fill-opacity=".13" stroke="#818cf8" stroke-opacity=".45"/>
      <text x="157" y="22" fill="#a5b4fc">⚙ AUTOMATE</text>
      <rect x="292" width="144" height="34" rx="17" fill="#c084fc" fill-opacity=".13" stroke="#c084fc" stroke-opacity=".45"/>
      <text x="313" y="22" fill="#d8b4fe">↗ OPTIMIZE</text>
    </g>
  </g>

  <g transform="translate(874 58)" filter="url(#shadow)">
    <rect x="0" y="42" width="242" height="150" rx="17" fill="#0b1223" stroke="url(#accent)" stroke-width="2"/>
    <rect x="0" y="42" width="242" height="33" rx="17" fill="#18223a"/>
    <path d="M0 75H242" stroke="#263454"/>
    <circle cx="20" cy="59" r="5" fill="#fb7185"/>
    <circle cx="38" cy="59" r="5" fill="#facc15"/>
    <circle cx="56" cy="59" r="5" fill="#4ade80"/>
    <text x="22" y="111" fill="#7dd3fc" font-family="Consolas, monospace" font-size="16">$ ship --better</text>
    <text x="22" y="142" fill="#a5b4fc" font-family="Consolas, monospace" font-size="16">✓ systems ready</text>
    <text x="22" y="173" fill="#d8b4fe" font-family="Consolas, monospace" font-size="16">✓ boring automated</text>
    <path d="M74 39c2-23 21-39 45-39 18 0 34 10 41 26 4-2 9-3 14-3 19 0 34 14 36 32H74c-12 0-22-9-22-20s10-20 22-20c3 0 6 1 9 2" fill="#e0f2fe" opacity=".94"/>
  </g>

  <circle cx="1145" cy="42" r="4" fill="#c084fc"/>
  <circle cx="1122" cy="238" r="3" fill="#38bdf8"/>
  <circle cx="834" cy="46" r="3" fill="#818cf8"/>
</svg>